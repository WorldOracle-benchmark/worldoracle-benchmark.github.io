name: Clear stuck Pages deployment

on:
  push:
    paths:
      - .github/workflows/clear-stuck-pages.yml

permissions:
  contents: read
  pages: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          response_code="$(curl -sS -o /tmp/pages-cancel-response -w '%{http_code}' \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/WorldOracle-benchmark/worldoracle-benchmark.github.io/pages/deployments/c83716cb694a8d3c511e6141eed988d123359b0a/cancel')"
          if [ "${response_code}" != "204" ]; then
            echo "Cancel request returned HTTP ${response_code}."
            cat /tmp/pages-cancel-response
            exit 1
          fi
          echo 'Stale Pages deployment canceled.'
